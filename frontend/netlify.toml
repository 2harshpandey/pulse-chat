# Netlify configuration
# Serves prerendered HTML for public SEO routes and SPA fallback for dynamic routes.

[[redirects]]
  from   = "/room/"
  to     = "/room"
  status = 301
  force  = true

[[redirects]]
  from   = "/about-developer/"
  to     = "/about-developer"
  status = 301
  force  = true

[[redirects]]
  from   = "/room"
  to     = "/room.html"
  status = 200

[[redirects]]
  from   = "/about-developer"
  to     = "/about-developer.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/me"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/join/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/error/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/room/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
