  <head>

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" id="theme-color-meta" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PulseChat" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="description" content="PulseChat is a real-time multi-room web chat app with password-protected rooms, voice notes, mosaic media albums, and instant invite links, with no signup." />
    <link rel="canonical" href="https://pulsechat.tech/" />
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PulseChat" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://pulsechat.tech/" />
    <meta property="og:title" content="PulseChat | Real-Time Multi-Room Chat Without Signup" />
    <meta property="og:description" content="PulseChat is a real-time multi-room web chat app with password-protected rooms, voice notes, mosaic media albums, and instant invite links, with no signup." />
    <meta property="og:image" content="https://pulsechat.tech/og-image.png" />
    <meta property="og:image:secure_url" content="https://pulsechat.tech/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PulseChat | Real-Time Multi-Room Web Chat Without Signup" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://pulsechat.tech/" />
    <meta name="twitter:title" content="PulseChat | Real-Time Multi-Room Chat Without Signup" />
    <meta name="twitter:description" content="PulseChat is a real-time multi-room web chat app with password-protected rooms, voice notes, mosaic media albums, and instant invite links, with no signup." />
    <meta name="twitter:image" content="https://pulsechat.tech/og-image.png" />
    <meta name="twitter:image:alt" content="PulseChat | Real-Time Multi-Room Web Chat Without Signup" />
    <link rel="image_src" href="https://pulsechat.tech/og-image.png" />
    <!-- Agentic Resource Discovery -->
    <link rel="ard" type="application/json" href="/.well-known/ard.json" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pulseTheme');
          var theme = saved ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var metaTheme = document.getElementById('theme-color-meta');
          if (metaTheme) {
            metaTheme.setAttribute('content', theme === 'dark' ? '#0f172a' : '#f7fafc');
          }
          var isStandalone =
            (window.matchMedia && (
              window.matchMedia('(display-mode: standalone)').matches ||
              window.matchMedia('(display-mode: window-controls-overlay)').matches ||
              window.matchMedia('(display-mode: fullscreen)').matches ||
              window.matchMedia('(display-mode: minimal-ui)').matches
            )) ||
            window.navigator.standalone === true ||
            (window.location.search && window.location.search.indexOf('pwa=1') !== -1);
          var path = window.location.pathname;
          if (isStandalone && (path === '/' || path === '/index.html')) {
            var lastLoc = localStorage.getItem('pulse_pwa_last_location');
            if (
              lastLoc &&
              lastLoc.charAt(0) === '/' &&
              lastLoc.charAt(1) !== '/' &&
              lastLoc !== '/index.html' &&
              lastLoc.indexOf('/error/') !== 0
            ) {
              document.documentElement.classList.add('pulse-pwa-restoring');
              setTimeout(function () {
                document.documentElement.classList.remove('pulse-pwa-restoring');
              }, 1500);
            }
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>html.pulse-pwa-restoring #root { visibility: hidden; }</style>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>PulseChat | Real-Time Multi-Room Chat Without Signup</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run PulseChat.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
